<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>观澜 · 区域国别研究写作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E3A5D'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23D9A441' stroke-width='2'/%3E%3Cpath d='M7 16h18M16 7c4 3 4 15 0 18c-4-3-4-15 0-18z' fill='none' stroke='%23D9A441' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 34 34" width="32" height="32"><rect width="34" height="34" rx="9" fill="url(#bg1)"/><defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#155079"/><stop offset="1" stop-color="#0A2C49"/></linearGradient></defs><circle cx="17" cy="17" r="9.5" fill="none" stroke="#D9A441" stroke-width="1.8"/><path d="M7.5 17h19M17 7.5c4.2 3 4.2 16 0 19c-4.2-3-4.2-16 0-19z" fill="none" stroke="#D9A441" stroke-width="1.3"/><circle cx="22.5" cy="11.5" r="2.4" fill="#D64541"/></svg>
      </div>
      <div class="brand-text">
        <strong>观澜研究台</strong>
        <span>区域国别 · 研究写作台</span>
      </div>
      <button class="icon-btn sidebar-close" data-action="close-mobile-nav" title="关闭菜单"></button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="me-card" id="meCard"></div>
      <button class="collapse-btn" data-action="toggle-collapse" id="collapseBtn" title="收起侧栏"></button>
    </div>
  </aside>
  <div class="nav-scrim" data-action="close-mobile-nav"></div>

  <div class="main-wrap">
    <header class="topbar">
      <button class="icon-btn hamburger" data-action="open-mobile-nav" title="菜单"></button>
      <div class="crumb" id="crumb"></div>
      <div class="global-search">
        <span class="gs-icon"></span>
        <input id="globalSearch" type="text" placeholder="检索研报 / 智库 / 关键词…  Ctrl K" autocomplete="off">
        <kbd>Ctrl K</kbd>
      </div>
      <button class="btn btn-primary launch-btn" data-action="dash-upload"><span class="i-spark"></span><span class="txt">上传范文</span></button>
      <div class="topbar-right">
        <button class="icon-btn bell" data-action="toggle-notif" id="bellBtn" title="任务通知"><span class="bell-dot" id="bellDot"></span></button>
        <button class="avatar-btn" data-action="toggle-user" id="userBtn"></button>
      </div>
      <div class="popover" id="notifPop"></div>
      <div class="popover" id="userPop"></div>
    </header>
    <main class="content" id="main" tabindex="-1"></main>
  </div>
</div>

<div class="drawer-scrim" id="drawerScrim" data-action="close-drawer"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true"></aside>
<div class="modal-scrim" id="modalScrim"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toasts" id="toasts"></div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/versions.js"></script>
<script src="js/skills.js"></script>
<script src="js/upload.js"></script>
<script src="js/generate.js"></script>
<script src="js/pages.js"></script>
<script src="js/topic.js"></script>
<script src="js/app.js"></script>
</body>
</html>
